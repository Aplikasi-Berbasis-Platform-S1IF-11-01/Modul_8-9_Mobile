name: notifikasi_hardware_api
description: >
  Project praktikum Flutter - Notifikasi & API Perangkat Keras.
  Mencakup penggunaan kamera, galeri, dan local notification.

# Versi Flutter minimum yang digunakan
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── UI & Icons ────────────────────────────────────────────────
  cupertino_icons: ^1.0.6

  # ─── Akses Kamera & Galeri ─────────────────────────────────────
  # Package resmi Flutter untuk mengambil gambar dari kamera & galeri
  image_picker: ^1.1.2

  # ─── Local Notification ────────────────────────────────────────
  # Package untuk menampilkan notifikasi lokal di device
  flutter_local_notifications: ^17.2.3

  # ─── Permission Handler ────────────────────────────────────────
  # Meminta izin runtime (kamera, storage) kepada user
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Jika ingin menambahkan asset/font custom, daftarkan di sini
  # assets:
  #   - assets/images/
