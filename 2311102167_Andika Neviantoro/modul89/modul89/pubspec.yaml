name: flutter_praktikum
description: Praktikum Notifikasi dan API Perangkat Keras - Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Untuk mengambil foto dari kamera atau galeri
  image_picker: ^1.0.7

  # Untuk menampilkan notifikasi lokal
  flutter_local_notifications: ^17.0.0

  # Ikon material tambahan
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true